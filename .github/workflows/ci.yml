name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Confui only ships for Windows, so the gate runs on the target platform:
    # path handling and the atomic rename-on-save behave differently elsewhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Electron 41 and its packaging helpers require Node >= 22.12.
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      # typecheck + vitest (unit, integration & E2E) + electron-vite build, per PROJECT_SPEC §7.
      - run: npm run check

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = ($env:GITHUB_REF_NAME).Substring(1)
          if ($packageVersion -ne $tagVersion) {
            throw "Release tag v$tagVersion does not match package.json version $packageVersion"
          }

      # Also exercise the Windows portable bundle; npm run check alone does
      # not catch missing Electron runtime files or locale trimming mistakes.
      - name: Verify portable package
        run: node scripts/package.mjs

      # The release gate requires a clean tree: tests must not touch fixtures.
      - name: Verify the working tree is clean
        shell: bash
        run: |
          unexpected=$(find . -path './.git' -prune -o -path './node_modules' -prune -o -path './out' -prune -o -path './release' -prune -o -path './output' -prune -o -type f \( -name '*.bak' -o -name '*.tmp' \) -print)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files remain in the repository:"
            echo "$unexpected"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after npm run check:"
            git status --porcelain
            exit 1
          fi
